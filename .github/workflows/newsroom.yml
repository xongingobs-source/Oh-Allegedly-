name: Newsroom robot

on:
  schedule:
    - cron: "*/20 * * * *"     # every 20 minutes: check channel, write stories, rebuild
  workflow_dispatch:            # "Run workflow" button for an instant refresh
    inputs:
      video_id:
        description: "Optional: force-write a specific YouTube video ID"
        required: false
  push:
    branches: [main]
    paths: ["content/**", "templates/**", "static/**", "config.yaml"]

permissions:
  contents: write
  pages: write
  id-token: write
  models: read        # free GitHub Models AI — no API key needed

concurrency:
  group: newsroom
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check YouTube & write stories
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}          # free AI writer (built in, nothing to set up)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}      # optional free backup writer
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # optional paid writer
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TRANSCRIPT_PROXY_URL: ${{ secrets.TRANSCRIPT_PROXY_URL }}
        run: |
          if [ -n "${{ github.event.inputs.video_id }}" ]; then
            python -m pipeline.run --video "${{ github.event.inputs.video_id }}"
          else
            python -m pipeline.run
          fi

      - name: Rebuild only (manual edits pushed)
        if: github.event_name == 'push'
        run: python -m pipeline.run --build

      - name: Save new stories to the repo
        run: |
          git config user.name  "oh-allegedly-newsroom[bot]"
          git config user.email "newsroom-bot@users.noreply.github.com"
          git add content data
          if ! git diff --cached --quiet; then
            git commit -m "newsroom: auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash && git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
