# ─────────────────────────────────────────────────────────────
#  OH ALLEGEDLY — automated newsroom settings
# ─────────────────────────────────────────────────────────────

site:
  name: "Oh Allegedly"
  tagline: "The tea, the receipts, the timeline. Allegedly."
  # Full public URL of the site (used in RSS + sitemap). No trailing slash.
  base_url: "https://xongingobs-source.github.io/Oh-Allegedly-"
  language: "en"
  timezone: "Africa/Johannesburg"
  # Stories newer than this many hours get the red BREAKING badge.
  breaking_window_hours: 6
  stories_on_homepage: 30

youtube:
  # Your channel ID starts with "UC". Find it at youtube.com/account_advanced
  # or on the channel's "About > Share channel > Copy channel ID".
  channel_ids:
    - "UCxxxxxxxxxxxxxxxxxxxxxx"
  # Optional: watch other channels too (e.g. creators you cover).
  # Their videos become articles credited to them.
  extra_channel_ids: []
  # Skip Shorts (videos under this many seconds need the API key to detect).
  skip_shorts: true
  # Only process videos published in the last N days on the first run,
  # so you don't burn credits converting your whole back-catalogue.
  backfill_days: 14

newsroom:
  # Which AI writes the stories, tried in order until one works.
  #   github = FREE GitHub Models (no key, no card — uses your repo's built-in token)
  #   gemini = FREE Google Gemini (needs a free GEMINI_API_KEY from aistudio.google.com)
  #   claude = paid Anthropic Claude (only used if ANTHROPIC_API_KEY is set)
  #   basic  = no AI: a simple "new video" post from the title, description and transcript
  providers: ["github", "gemini", "basic"]
  models:
    github: "openai/gpt-4o-mini"      # free "low" tier: ~150 requests/day
    gemini: "gemini-flash-latest"
    claude: "claude-sonnet-5-5"
  # "publish" = articles go live automatically.
  # "draft"   = articles are written to content/drafts/ and wait for you
  #             to move them to content/articles/ (recommended for
  #             allegation-heavy content — see README "Legal safety").
  mode: "publish"
  # Max new articles per run (keeps you inside the free daily limits).
  max_articles_per_run: 3
  # Section names the writer can pick from.
  categories:
    - "Breaking"
    - "Creators"
    - "Celebrity"
    - "Court & Legal"
    - "Internet Culture"
    - "Livestream Recap"
  # House style injected into the writing prompt.
  style_notes: >
    Punchy tabloid-newsroom energy but factually careful. Every claim
    about a real person is attributed ("according to", "allegedly",
    "claimed in the video"). Never state an allegation as fact.
    Short paragraphs. British/South African spelling.
